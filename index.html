<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSE Markets - TradeCalc Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="nav.js" defer></script>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <div id="navbar"></div>

    <!-- Ticker Tape -->
    <div class="tradingview-widget-container border-b border-gray-800">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
        {
            "symbols": [
                {"proName": "NSE:NIFTY", "title": "NIFTY 50"},
                {"proName": "NSE:BANKNIFTY", "title": "BANK NIFTY"},
                {"proName": "BSE:SENSEX", "title": "SENSEX"},
                {"proName": "NSE:RELIANCE", "title": "RELIANCE"},
                {"proName": "NSE:TCS", "title": "TCS"}
            ],
            "colorTheme": "dark",
            "isTransparent": false,
            "displayMode": "adaptive",
            "locale": "en"
        }
        </script>
    </div>

    <main class="p-6 max-w-7xl mx-auto">
        <h1 class="text-2xl font-bold mb-4 text-blue-400">NSE Technical Analysis</h1>
        
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-4">
            <!-- Quick Scrip Switcher Sidebar -->
            <div class="bg-gray-800 p-4 rounded-lg border border-gray-700">
                <h2 class="text-lg font-semibold mb-3 text-gray-300">Popular Scrips</h2>
                <div class="space-y-2">
                    <button onclick="loadChart('NSE:NIFTY')" class="w-full text-left px-3 py-2 bg-gray-700 hover:bg-blue-600 rounded transition">NIFTY 50</button>
                    <button onclick="loadChart('NSE:BANKNIFTY')" class="w-full text-left px-3 py-2 bg-gray-700 hover:bg-blue-600 rounded transition">BANK NIFTY</button>
                    <button onclick="loadChart('NSE:RELIANCE')" class="w-full text-left px-3 py-2 bg-gray-700 hover:bg-blue-600 rounded transition">RELIANCE</button>
                    <button onclick="loadChart('NSE:TCS')" class="w-full text-left px-3 py-2 bg-gray-700 hover:bg-blue-600 rounded transition">TCS</button>
                    <button onclick="loadChart('NSE:INFY')" class="w-full text-left px-3 py-2 bg-gray-700 hover:bg-blue-600 rounded transition">INFOSYS</button>
                </div>
            </div>

            <!-- Main Interactive Chart -->
            <div class="lg:col-span-3 bg-gray-800 p-4 rounded-lg border border-gray-700 h-[600px]">
                <div id="tradingview_chart" style="height:100%;width:100%"></div>
            </div>
        </div>
    </main>

    <!-- TradingView Script -->
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script type="text/javascript">
        function loadChart(symbolName) {
            document.getElementById("tradingview_chart").innerHTML = "";
            if (typeof TradingView !== "undefined") {
                new TradingView.widget({
                    "autosize": true,
                    "symbol": symbolName,
                    "interval": "D",
                    "timezone": "Asia/Kolkata",
                    "theme": "dark",
                    "style": "1",
                    "locale": "en",
                    "enable_publishing": false,
                    "allow_symbol_change": true,
                    "container_id": "tradingview_chart"
                });
            }
        }

        // Initialize with NIFTY 50 once window loads
        window.onload = function() {
            loadChart('NSE:NIFTY');
        };
    </script>
</body>
</html>
