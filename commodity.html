<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCX Market Range Calculator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen">

  <div id="navbar"></div>

  <div class="max-w-5xl mx-auto p-6 mt-6">
    <div class="bg-slate-800 rounded-xl p-6 shadow-xl border border-slate-700">
      <h1 class="text-2xl font-bold text-amber-400 text-center uppercase mb-6">MCX Commodity Range Calculator</h1>

      <div id="market-buttons" class="flex flex-wrap gap-2 justify-center bg-slate-900 p-4 rounded-lg mb-6 border border-slate-700 max-h-48 overflow-y-auto"></div>

      <div class="bg-amber-500 text-black p-6 rounded-t-xl text-center">
        <h2 id="selected-name" class="text-3xl font-black mb-3">GOLD</h2>
        <div class="flex justify-center gap-6">
          <div class="bg-slate-100 px-6 py-2 rounded text-black font-bold">LOT SIZE: <span id="lot-size">100</span></div>
          <div class="bg-black text-white px-6 py-2 rounded font-bold">LIVE CMP: <span id="cmp-val">152815</span></div>
        </div>
      </div>

      <div class="overflow-x-auto bg-slate-800 rounded-b-xl p-4 border-t border-slate-700">
        <table class="w-full text-left">
          <thead>
            <tr class="bg-slate-900 text-slate-400 text-sm">
              <th class="p-3">SNAME</th>
              <th class="p-3">LOT</th>
              <th class="p-3">CMP</th>
              <th class="p-3">LEVEL</th>
              <th class="p-3">UP LEVEL</th>
              <th class="p-3">DOWN LEVEL</th>
              <th class="p-3">ACTION</th>
            </tr>
          </thead>
          <tbody id="levels-table-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="nav.js"></script>
  <script>
    const mcxData = [
      { name: "GOLD", cmp: 152815, net: 182.69, lot: 100 },
      { name: "GOLD MINI", cmp: 152815, net: 290.46, lot: 10 },
      { name: "GOLD GUINEA", cmp: 122820, net: 212.00, lot: 1 },
      { name: "GOLD TEN", cmp: 152815, net: 243.58, lot: 1 },
      { name: "GOLD PETAL", cmp: 15356, net: 44.49, lot: 1 },
      { name: "SILVER", cmp: 237500, net: 593.00, lot: 30 },
      { name: "SILVER MINI", cmp: 237500, net: 593.00, lot: 5 },
      { name: "SILVER MICRO", cmp: 237500, net: 593.00, lot: 1 },
      { name: "CRUDE", cmp: 8571, net: 50.04, lot: 100 },
      { name: "CRUDE MINI", cmp: 8571, net: 50.04, lot: 10 },
      { name: "NATURAL GAS", cmp: 281, net: 9.88, lot: 1250 },
      { name: "NAT GAS MINI", cmp: 281, net: 9.88, lot: 250 },
      { name: "ALUMINUM", cmp: 348, net: 3.50, lot: 5000 },
      { name: "ALUMINUM MINI", cmp: 348, net: 3.50, lot: 1000 },
      { name: "LEAD", cmp: 197, net: 2.78, lot: 5000 },
      { name: "LEAD MINI", cmp: 197, net: 2.78, lot: 1000 },
      { name: "ZINC", cmp: 418, net: 3.96, lot: 5000 },
      { name: "ZINC MINI", cmp: 418, net: 3.96, lot: 1000 },
      { name: "COPPER", cmp: 1378, net: 17.74, lot: 2500 },
      { name: "NICKEL", cmp: 1617, net: 35.36, lot: 2500 }
    ];

    function renderButtons() {
      const container = document.getElementById("market-buttons");
      container.innerHTML = "";
      mcxData.forEach((item, index) => {
        const btn = document.createElement("button");
        btn.className = `px-3 py-1.5 text-xs font-bold rounded border ${index === 0 ? 'bg-amber-500 text-black border-amber-500' : 'bg-slate-800 text-white border-slate-600 hover:border-amber-400'}`;
        btn.innerText = item.name;
        btn.onclick = () => {
          document.querySelectorAll("#market-buttons button").forEach(b => {
            b.className = "px-3 py-1.5 text-xs font-bold rounded border bg-slate-800 text-white border-slate-600";
          });
          btn.className = "px-3 py-1.5 text-xs font-bold rounded border bg-amber-500 text-black border-amber-500";
          calculateAndDisplay(item);
        };
        container.appendChild(btn);
      });
      if (mcxData.length > 0) calculateAndDisplay(mcxData[0]);
    }

    function calculateAndDisplay(item) {
      document.getElementById("selected-name").innerText = item.name;
      document.getElementById("lot-size").innerText = item.lot;
      document.getElementById("cmp-val").innerText = item.cmp.toLocaleString('en-IN');

      const tableBody = document.getElementById("levels-table-body");
      tableBody.innerHTML = "";

      const levels = [
        { label: "L1 (Range A)", mult: 1 },
        { label: "L2 (Range B)", mult: 2 },
        { label: "L3 (Range C)", mult: 3 }
      ];

      levels.forEach(lvl => {
        const upLevel = (item.cmp + (item.net * lvl.mult)).toFixed(2);
        const downLevel = (item.cmp - (item.net * lvl.mult)).toFixed(2);
        const waText = encodeURIComponent(`*${item.name}* Level: ${lvl.label}\nCMP: ${item.cmp}\nUP: ${upLevel}\nDOWN: ${downLevel}`);

        const row = `
          <tr class="border-b border-slate-700">
            <td class="p-3 font-bold text-amber-400">${item.name}</td>
            <td class="p-3">${item.lot}</td>
            <td class="p-3">${item.cmp.toLocaleString('en-IN')}</td>
            <td class="p-3">${lvl.label}</td>
            <td class="p-3 font-bold text-emerald-400">${Number(upLevel).toLocaleString('en-IN', {minimumFractionDigits: 2})}</td>
            <td class="p-3 font-bold text-rose-500">${Number(downLevel).toLocaleString('en-IN', {minimumFractionDigits: 2})}</td>
            <td class="p-3"><a href="https://api.whatsapp.com/send?text=${waText}" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1 rounded text-xs font-bold inline-block">💬 WhatsApp</a></td>
          </tr>
        `;
        tableBody.innerHTML += row;
      });
    }

    renderButtons();
  </script>
</body>
</html>
