<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Market Range Calculator - TradeCalc Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen relative pb-12">

    <!-- MAIN CONTENT -->
    <div id="main-content">
        
        <!-- Live Ticker Tape Container -->
        <div id="ticker-container" class="tradingview-widget-container mb-4"></div>

        <main class="p-6 max-w-7xl mx-auto">
            
            <!-- MARKET CATEGORY TABS -->
            <div class="flex flex-wrap gap-3 mb-6 justify-center border-b border-gray-700 pb-4">
                <button id="tab-NSE" onclick="switchMarket('NSE')" class="px-6 py-2.5 font-bold rounded-lg text-lg transition bg-amber-500 text-black">
                    📈 NSE Equity
                </button>
                <button id="tab-MCX" onclick="switchMarket('MCX')" class="px-6 py-2.5 font-bold rounded-lg text-lg transition bg-gray-800 hover:bg-gray-700 text-gray-300">
                    🪙 MCX Commodity
                </button>
                <button id="tab-FOREX" onclick="switchMarket('FOREX')" class="px-6 py-2.5 font-bold rounded-lg text-lg transition bg-gray-800 hover:bg-gray-700 text-gray-300">
                    💱 Forex Pairs
                </button>
            </div>

            <!-- Scrip Buttons Grid -->
            <div class="flex flex-wrap gap-2 mb-6 bg-gray-800 p-4 rounded-lg border border-gray-700 max-h-52 overflow-y-auto" id="scrip-buttons"></div>

            <!-- Calculator Header -->
            <div class="bg-amber-500 text-gray-900 p-6 rounded-t-lg shadow-md border-b-2 border-amber-600">
                <h1 id="header-title" class="text-4xl font-black text-center tracking-wider uppercase mb-6 text-black">NIFTY 50</h1>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-xl mx-auto">
                    <div>
                        <label class="block text-xs font-black uppercase mb-1 text-gray-900">LOT SIZE</label>
                        <input type="number" id="lot-input" readonly class="w-full bg-gray-100 text-black font-bold p-3 rounded border border-gray-400 text-xl text-center focus:outline-none cursor-not-allowed">
                    </div>
                    <div>
                        <label class="block text-xs font-black uppercase mb-1 text-gray-900">LIVE CMP</label>
                        <input type="number" id="cmp-input" step="any" oninput="calculateLevels()" class="w-full bg-black text-white font-bold p-3 rounded border border-gray-800 text-xl text-center focus:outline-none">
                    </div>
                </div>

                <!-- Range Selectors -->
                <div class="flex flex-wrap justify-center gap-6 mt-6 text-xs font-black text-black">
                    <label class="flex items-center space-x-1 cursor-pointer"><input type="radio" name="range" value="1" onchange="calculateLevels()"> <span>RANGE A</span></label>
                    <label class="flex items-center space-x-1 cursor-pointer"><input type="radio" name="range" value="2" onchange="calculateLevels()"> <span>RANGE B</span></label>
                    <label class="flex items-center space-x-1 cursor-pointer"><input type="radio" name="range" value="3" onchange="calculateLevels()"> <span>RANGE C</span></label>
                    <label class="flex items-center space-x-1 cursor-pointer"><input type="radio" name="range" value="4" onchange="calculateLevels()"> <span>RANGE D</span></label>
                    <label class="flex items-center space-x-1 cursor-pointer"><input type="radio" name="range" value="5" checked onchange="calculateLevels()"> <span>RANGE E</span></label>
                </div>
            </div>

            <!-- Output Table -->
            <div class="bg-gray-800 p-6 rounded-b-lg border border-gray-700 shadow-xl mb-6">
                <div class="flex justify-between items-center mb-6 font-bold text-xl border-b border-gray-700 pb-3">
                    <span class="text-emerald-400">TOTAL UP: <span id="total-up">0.00</span></span>
                    <span class="text-rose-500">TOTAL DOWN: <span id="total-down">0.00</span></span>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead class="bg-gray-700 text-gray-200 uppercase text-[18px]">
                            <tr>
                                <th class="p-4">SNAME</th>
                                <th class="p-4">LOT</th>
                                <th class="p-4">CMP</th>
                                <th class="p-4">LEVEL</th>
                                <th class="p-4 text-emerald-400">UP LEVEL</th>
                                <th class="p-4 text-rose-500">DOWN LEVEL</th>
                                <th class="p-4 text-center">ACTION</th>
                            </tr>
                        </thead>
                        <tbody id="levels-table" class="divide-y divide-gray-700"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- BOTTOM RUNNING SCROLL TEXT -->
    <div class="fixed bottom-0 left-0 w-full bg-amber-500 text-black py-2 overflow-hidden whitespace-nowrap z-40 border-t border-amber-600 font-black">
        <div class="inline-block animate-marquee uppercase tracking-widest text-sm">
            ⚠️ THIS IS FOR EDUCATIONAL PURPOSE ONLY — HAPPY TRADING &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ⚠️ THIS IS FOR EDUCATIONAL PURPOSE ONLY — HAPPY TRADING
        </div>
    </div>

    <style>
        @keyframes marquee {
            0% { transform: translateX(0%); }
            100% { transform: translateX(-50%); }
        }
        .animate-marquee {
            display: inline-block;
            white-space: nowrap;
            animation: marquee 18s linear infinite;
        }
    </style>

    <script type="text/javascript">
        let activeMarket = "NSE";
        let currentScrip = "NIFTY 50";

        const marketData = {
            "NSE": {
                "NIFTY 50": { cmp: 24500.00, lot: 50, stepPct: 0.005, decimals: 2 },
                "BANK NIFTY": { cmp: 51200.00, lot: 15, stepPct: 0.005, decimals: 2 },
                "FIN NIFTY": { cmp: 23100.00, lot: 40, stepPct: 0.005, decimals: 2 },
                "RELIANCE": { cmp: 2950.00, lot: 250, stepPct: 0.008, decimals: 2 },
                "TCS": { cmp: 4150.00, lot: 175, stepPct: 0.008, decimals: 2 },
                "INFOSYS": { cmp: 1820.00, lot: 400, stepPct: 0.008, decimals: 2 },
                "HDFC BANK": { cmp: 1640.00, lot: 550, stepPct: 0.008, decimals: 2 },
                "ICICI BANK": { cmp: 1210.00, lot: 700, stepPct: 0.008, decimals: 2 },
                "SBIN": { cmp: 820.00, lot: 1500, stepPct: 0.008, decimals: 2 },
                "BHARTI AIRTEL": { cmp: 1450.00, lot: 475, stepPct: 0.008, decimals: 2 }
            },
            "MCX": {
                "GOLD": { cmp: 72500.00, lot: 100, stepPct: 0.000237, decimals: 2 },
                "GOLD MINI": { cmp: 72500.00, lot: 10, stepPct: 0.00025, decimals: 2 },
                "SILVER": { cmp: 85000.00, lot: 30, stepPct: 0.0004, decimals: 2 },
                "SILVER MINI": { cmp: 85000.00, lot: 5, stepPct: 0.0004, decimals: 2 },
                "CRUDE OIL": { cmp: 6200.00, lot: 100, stepPct: 0.001, decimals: 2 },
                "NATURAL GAS": { cmp: 185.00, lot: 1250, stepPct: 0.003, decimals: 2 },
                "COPPER": { cmp: 810.00, lot: 2500, stepPct: 0.0015, decimals: 2 }
            },
            "FOREX": {
                "USD/INR": { cmp: 83.95, lot: 1000, stepPct: 0.0005, decimals: 4 },
                "EUR/INR": { cmp: 92.40, lot: 1000, stepPct: 0.0005, decimals: 4 },
                "GBP/INR": { cmp: 109.80, lot: 1000, stepPct: 0.0005, decimals: 4 },
                "JPY/INR": { cmp: 57.20, lot: 1000, stepPct: 0.0005, decimals: 4 },
                "EUR/USD": { cmp: 1.0850, lot: 100000, stepPct: 0.0003, decimals: 4 },
                "GBP/USD": { cmp: 1.2950, lot: 100000, stepPct: 0.0003, decimals: 4 },
                "USD/JPY": { cmp: 146.50, lot: 100000, stepPct: 0.0003, decimals: 3 }
            }
        };

        window.onload = function() {
            switchMarket('NSE');
        };

        function switchMarket(market) {
            activeMarket = market;

            // Update Tab Highlight
            ['NSE', 'MCX', 'FOREX'].forEach(m => {
                const tab = document.getElementById(`tab-${m}`);
                if (m === market) {
                    tab.className = "px-6 py-2.5 font-bold rounded-lg text-lg transition bg-amber-500 text-black";
                } else {
                    tab.className = "px-6 py-2.5 font-bold rounded-lg text-lg transition bg-gray-800 hover:bg-gray-700 text-gray-300";
                }
            });

            // Update Ticker Widget
            updateTicker(market);

            // Load buttons for selected market
            renderButtons();
            const firstScrip = Object.keys(marketData[market])[0];
            selectScrip(firstScrip);
        }

        function updateTicker(market) {
            const container = document.getElementById("ticker-container");
            container.innerHTML = `<div class="tradingview-widget-container__widget"></div>`;

            let symbols = [];
            if (market === "NSE") {
                symbols = [
                    { "proName": "NSE:NIFTY", "title": "NIFTY 50" },
                    { "proName": "NSE:BANKNIFTY", "title": "BANK NIFTY" },
                    { "proName": "NSE:FINNIFTY", "title": "FIN NIFTY" },
                    { "proName": "NSE:RELIANCE", "title": "RELIANCE" }
                ];
            } else if (market === "MCX") {
                symbols = [
                    { "proName": "MCX:GOLD1!", "title": "GOLD" },
                    { "proName": "MCX:SILVER1!", "title": "SILVER" },
                    { "proName": "MCX:CRUDEOIL1!", "title": "CRUDE OIL" }
                ];
            } else if (market === "FOREX") {
                symbols = [
                    { "proName": "FX_IDC:USDINR", "title": "USD/INR" },
                    { "proName": "FX_IDC:EURINR", "title": "EUR/INR" },
                    { "proName": "FX:EURUSD", "title": "EUR/USD" },
                    { "proName": "FX:GBPUSD", "title": "GBP/USD" }
                ];
            }

            const script = document.createElement("script");
            script.type = "text/javascript";
            script.src = "https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js";
            script.async = true;
            script.innerHTML = JSON.stringify({
                "symbols": symbols,
                "showSymbolLogo": true,
                "colorTheme": "dark",
                "isTransparent": false,
                "displayMode": "adaptive",
                "locale": "in"
            });
            container.appendChild(script);
        }

        function renderButtons() {
            const container = document.getElementById("scrip-buttons");
            container.innerHTML = "";

            Object.keys(marketData[activeMarket]).forEach(name => {
                const btn = document.createElement("button");
                btn.className = `scrip-btn px-3.5 py-2 bg-gray-700 hover:bg-amber-500 hover:text-black rounded text-sm font-semibold transition text-gray-200`;
                btn.innerText = name;
                btn.onclick = () => selectScrip(name);
                container.appendChild(btn);
            });
        }

        function selectScrip(name) {
            currentScrip = name;
            document.getElementById("header-title").innerText = name;

            const item = marketData[activeMarket][name];
            document.getElementById("lot-input").value = item.lot;
            document.getElementById("cmp-input").value = item.cmp;

            const buttons = document.querySelectorAll(".scrip-btn");
            buttons.forEach(btn => {
                if (btn.innerText.trim() === name) {
                    btn.classList.add("bg-amber-500", "text-black", "font-bold");
                    btn.classList.remove("bg-gray-700", "text-gray-200");
                } else {
                    btn.classList.remove("bg-amber-500", "text-black", "font-bold");
                    btn.classList.add("bg-gray-700", "text-gray-200");
                }
            });

            calculateLevels();
        }

        function calculateLevels() {
            const cmp = parseFloat(document.getElementById("cmp-input").value) || 0;
            const lot = parseFloat(document.getElementById("lot-input").value) || 0;
            const item = marketData[activeMarket][currentScrip] || {};
            const stepPct = item.stepPct || 0.008;
            const decimals = item.decimals || 2;
            const stepValue = cmp * stepPct;

            const selectedRange = parseInt(document.querySelector('input[name="range"]:checked').value) || 5;

            document.getElementById("total-up").innerText = (cmp + (stepValue * selectedRange)).toLocaleString('en-IN', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
            document.getElementById("total-down").innerText = (cmp - (stepValue * selectedRange)).toLocaleString('en-IN', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });

            const tbody = document.getElementById("levels-table");
            tbody.innerHTML = "";

            for (let i = 1; i <= selectedRange; i++) {
                const upLevel = cmp + (stepValue * i);
                const downLevel = cmp - (stepValue * i);
                const levelName = `L${i} (Range ${String.fromCharCode(64 + i)})`;

                const row = `
                    <tr class="hover:bg-gray-800 text-[18px]">
                        <td class="p-4 font-bold text-amber-400">${currentScrip}</td>
                        <td class="p-4">${lot.toLocaleString('en-IN')}</td>
                        <td class="p-4">${cmp.toLocaleString('en-IN', { minimumFractionDigits: decimals })}</td>
                        <td class="p-4 text-gray-300">${levelName}</td>
                        <td class="p-4 font-bold text-emerald-400">${upLevel.toLocaleString('en-IN', { minimumFractionDigits: decimals, maximumFractionDigits: decimals })}</td>
                        <td class="p-4 font-bold text-rose-500">${downLevel.toLocaleString('en-IN', { minimumFractionDigits: decimals, maximumFractionDigits: decimals })}</td>
                        <td class="p-4 text-center">
                            <button onclick="shareWhatsApp('${currentScrip}', ${cmp}, '${levelName}', ${upLevel.toFixed(decimals)}, ${downLevel.toFixed(decimals)})" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded text-sm font-bold flex items-center justify-center gap-1 mx-auto">
                                💬 WhatsApp
                            </button>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            }
        }

        function shareWhatsApp(scrip, cmp, level, up, down) {
            const text = `📊 *${activeMarket} LEVEL ALERT: ${scrip}*\n\n` +
                         `📍 *CMP:* ${cmp}\n` +
                         `🎯 *Target Level:* ${level}\n\n` +
                         `📈 *UP LEVEL:* ${up}\n` +
                         `📉 *DOWN LEVEL:* ${down}\n\n` +
                         `_Shared via TradeCalc Hub (Educational Purpose Only)_`;
            
            const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
