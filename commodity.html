<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commodity Calculator - TradeCalc Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="nav.js" defer></script>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <div id="navbar"></div>

    <main class="p-6 max-w-6xl mx-auto">
        <!-- Horizontal Commodity Buttons -->
        <div class="flex flex-wrap gap-2 mb-6 bg-gray-800 p-4 rounded-lg border border-gray-700" id="button-container"></div>

        <!-- Calculator Inputs Header -->
        <div class="bg-amber-500 text-gray-900 p-6 rounded-t-lg shadow-md border-b-2 border-amber-600">
            <h1 id="header-title" class="text-3xl font-black text-center tracking-wider uppercase mb-4 text-gray-900">GOLD</h1>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 max-w-2xl mx-auto">
                <div>
                    <label class="block text-xs font-bold uppercase mb-1 text-gray-900">Lot Size</label>
                    <input type="number" id="lot-input" readonly class="w-full bg-gray-200 text-black p-2.5 rounded font-bold border border-amber-700 focus:outline-none cursor-not-allowed">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase mb-1 text-gray-900">Live CMP</label>
                    <input type="number" id="cmp-input" step="any" oninput="calculateLevels()" class="w-full bg-black text-white p-2.5 rounded font-bold border border-amber-700 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase mb-1 text-gray-900">Net Value</label>
                    <input type="number" id="net-input" step="any" oninput="calculateLevels()" class="w-full bg-black text-white p-2.5 rounded font-bold border border-amber-700 focus:outline-none">
                </div>
            </div>

            <!-- Range Radio Buttons (1 to 5 levels) -->
            <div class="flex flex-wrap justify-center gap-4 mt-4 text-xs font-bold text-gray-900">
                <label class="flex items-center space-x-1 cursor-pointer"><input type="radio" name="range" value="1" onchange="calculateLevels()"> <span>RANGE A (1 Level)</span></label>
                <label class="flex items-center space-x-1 cursor-pointer"><input type="radio" name="range" value="2" onchange="calculateLevels()"> <span>RANGE B (2 Levels)</span></label>
                <label class="flex items-center space-x-1 cursor-pointer"><input type="radio" name="range" value="3" onchange="calculateLevels()"> <span>RANGE C (3 Levels)</span></label>
                <label class="flex items-center space-x-1 cursor-pointer"><input type="radio" name="range" value="4" onchange="calculateLevels()"> <span>RANGE D (4 Levels)</span></label>
                <label class="flex items-center space-x-1 cursor-pointer"><input type="radio" name="range" value="5" checked onchange="calculateLevels()"> <span>RANGE E (5 Levels)</span></label>
            </div>
        </div>

        <!-- Calculation Output Card -->
        <div class="bg-gray-800 p-6 rounded-b-lg border border-gray-700 shadow-xl">
            <div class="flex justify-between items-center mb-6 font-bold text-lg border-b border-gray-700 pb-3">
                <span class="text-emerald-400">TOTAL UP (CMP + NET): <span id="total-up">0.00</span></span>
                <span class="text-rose-500">TOTAL DOWN (CMP - NET): <span id="total-down">0.00</span></span>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-gray-700 text-gray-300 uppercase text-xs">
                        <tr>
                            <th class="p-3">SNAME</th>
                            <th class="p-3">LOT</th>
                            <th class="p-3">CMP</th>
                            <th class="p-3">LEVEL</th>
                            <th class="p-3 text-emerald-400">BUY LEVEL</th>
                            <th class="p-3 text-rose-500">SELL LEVEL</th>
                        </tr>
                    </thead>
                    <tbody id="levels-table" class="divide-y divide-gray-700">
                        <!-- Dynamic output based on range selection -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const commodityData = {
            "GOLD": { cmp: 152815.00, net: 182.69, lot: 100.00 },
            "GOLD MINI": { cmp: 152815.00, net: 290.46, lot: 10.00, isRed: true },
            "GOLD GUIENEA": { cmp: 122820.00, net: 212.00, lot: 1.00 },
            "GOLD TEN": { cmp: 152815.00, net: 243.58, lot: 1.00 },
            "GOLD PETAL": { cmp: 15356.00, net: 44.49, lot: 1.00 },
            "SILVER": { cmp: 237500.00, net: 593.00, lot: 30.00 },
            "SILVER MINI": { cmp: 237500.00, net: 593.00, lot: 5.00, isRed: true },
            "SILVER MICRO": { cmp: 237500.00, net: 593.00, lot: 1.00 },
            "CRUDE": { cmp: 8571.00, net: 50.04, lot: 100.00 },
            "CRUDE MINI": { cmp: 8571.00, net: 50.04, lot: 10.00, isRed: true },
            "NATURAL GAS": { cmp: 281.00, net: 9.88, lot: 1250.00 },
            "NATURAL GAS MIN": { cmp: 281.00, net: 9.88, lot: 250.00, isRed: true },
            "ALUMINUM": { cmp: 348.00, net: 3.50, lot: 5000.00 },
            "ALUMINUM MINI": { cmp: 348.00, net: 3.50, lot: 1000.00, isRed: true },
            "LEAD": { cmp: 197.00, net: 2.78, lot: 5000.00 },
            "LEAD MINI": { cmp: 197.00, net: 2.78, lot: 1000.00, isRed: true },
            "ZINC": { cmp: 418.00, net: 3.96, lot: 5000.00 },
            "ZINC MINI": { cmp: 418.00, net: 3.96, lot: 1000.00, isRed: true },
            "COPPER": { cmp: 1378.00, net: 17.74, lot: 2500.00 },
            "NICKEL": { cmp: 1617.00, net: 35.36, lot: 2500.00 }
        };

        let currentScrip = "GOLD";

        function renderButtons() {
            const container = document.getElementById("button-container");
            container.innerHTML = "";
            
            Object.keys(commodityData).forEach(scrip => {
                const isRed = commodityData[scrip].isRed;
                const textColor = isRed ? "text-red-400 font-bold" : "text-gray-200";
                
                const btn = document.createElement("button");
                btn.className = `scrip-btn px-3 py-1.5 bg-gray-700 hover:bg-amber-600 rounded text-sm transition ${textColor}`;
                btn.innerText = scrip;
                btn.onclick = () => selectScrip(scrip);
                container.appendChild(btn);
            });
        }

        function selectScrip(scripName) {
            currentScrip = scripName;
            document.getElementById("header-title").innerText = scripName;
            
            const item = commodityData[scripName];
            document.getElementById("lot-input").value = item.lot;
            document.getElementById("cmp-input").value = item.cmp;
            document.getElementById("net-input").value = item.net;
            
            const buttons = document.querySelectorAll(".scrip-btn");
            buttons.forEach(btn => {
                if (btn.innerText.trim() === scripName) {
                    btn.classList.add("bg-amber-600", "text-white");
                    btn.classList.remove("bg-gray-700");
                } else {
                    btn.classList.remove("bg-amber-600", "text-white");
                    btn.classList.add("bg-gray-700");
                }
            });

            calculateLevels();
        }

        function calculateLevels() {
            const cmp = parseFloat(document.getElementById("cmp-input").value) || 0;
            const net = parseFloat(document.getElementById("net-input").value) || 0;
            const lot = parseFloat(document.getElementById("lot-input").value) || 0;
            const netStep = net / 5;

            // Get current selected max range level (1 to 5)
            const selectedRange = parseInt(document.querySelector('input[name="range"]:checked').value) || 5;

            document.getElementById("total-up").innerText = (cmp + net).toLocaleString('en-IN', { minimumFractionDigits: 2 });
            document.getElementById("total-down").innerText = (cmp - net).toLocaleString('en-IN', { minimumFractionDigits: 2 });

            const tbody = document.getElementById("levels-table");
            tbody.innerHTML = "";

            // Render rows only up to the selected range limit
            for (let i = 1; i <= selectedRange; i++) {
                const buyLevel = cmp + (netStep * i);
                const sellLevel = cmp - (netStep * i);

                const row = `
                    <tr class="hover:bg-gray-800">
                        <td class="p-3 font-bold ${commodityData[currentScrip]?.isRed ? 'text-red-400' : 'text-amber-400'}">${currentScrip}</td>
                        <td class="p-3">${lot.toLocaleString('en-IN')}</td>
                        <td class="p-3">${cmp.toLocaleString('en-IN', { minimumFractionDigits: 2 })}</td>
                        <td class="p-3 text-gray-400">L${i} (Range ${String.fromCharCode(64 + i)})</td>
                        <td class="p-3 font-bold text-emerald-400">${buyLevel.toLocaleString('en-IN', { minimumFractionDigits: 2 })}</td>
                        <td class="p-3 font-bold text-rose-500">${sellLevel.toLocaleString('en-IN', { minimumFractionDigits: 2 })}</td>
                    </tr>
                `;
                tbody.innerHTML += row;
            }
        }

        window.addEventListener("DOMContentLoaded", () => {
            renderButtons();
            selectScrip("GOLD");
        });
    </script>
</body>
</html>
