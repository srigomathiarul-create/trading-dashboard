<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commodity Level Calculator - TradeCalc Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen relative pb-12">

    <div id="main-content">
        <!-- Live TradingView MCX Ticker Tape -->
        <div class="tradingview-widget-container mb-4">
            <div class="tradingview-widget-container__widget"></div>
            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
            {
                "symbols": [
                    { "proName": "MCX:GOLD1!", "title": "GOLD" },
                    { "proName": "MCX:SILVER1!", "title": "SILVER" },
                    { "proName": "MCX:CRUDEOIL1!", "title": "CRUDE OIL" },
                    { "proName": "MCX:NATURALGAS1!", "title": "NATURAL GAS" },
                    { "proName": "MCX:COPPER1!", "title": "COPPER" },
                    { "proName": "MCX:ZINC1!", "title": "ZINC" }
                ],
                "showSymbolLogo": true,
                "colorTheme": "dark",
                "isTransparent": false,
                "displayMode": "adaptive",
                "locale": "in"
            }
            </script>
        </div>

        <main class="p-6 max-w-7xl mx-auto">
            <h1 class="text-2xl font-bold mb-4 text-amber-400">MCX Commodity Range Calculator</h1>

            <!-- Buttons Grid -->
            <div class="flex flex-wrap gap-2 mb-6 bg-gray-800 p-4 rounded-lg border border-gray-700 max-h-56 overflow-y-auto" id="commodity-buttons"></div>

            <!-- Calculator Inputs -->
            <div class="bg-amber-500 text-gray-900 p-6 rounded-t-lg shadow-md border-b-2 border-amber-600">
                <h1 id="header-title" class="text-4xl font-black text-center tracking-wider uppercase mb-6 text-black">GOLD</h1>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-xl mx-auto">
                    <div>
                        <label class="block text-xs font-black uppercase mb-1 text-gray-900">LOT SIZE</label>
                        <input type="number" id="lot-input" readonly class="w-full bg-gray-100 text-black font-bold p-3 rounded border border-gray-400 text-xl text-center focus:outline-none cursor-not-allowed">
                    </div>
                    <div>
                        <label class="block text-xs font-black uppercase mb-1 text-gray-900">LIVE CMP</label>
                        <input type="number" id="cmp-input" step="any" oninput="calculateLevels()" class="w-full bg-black text-white font-bold p-3 rounded border border-gray-800 text-xl text-center focus:outline-none">
                    </div>
                </div>

                <!-- Range Options -->
                <div class="flex flex-wrap justify-center gap-6 mt-6 text-xs font-black text-black">
                    <label class="flex items-center space-x-1 cursor-pointer"><input type="radio" name="range" value="1" onchange="calculateLevels()"> <span>RANGE A</span></label>
                    <label class="flex items-center space-x-1 cursor-pointer"><input type="radio" name="range" value="2" onchange="calculateLevels()"> <span>RANGE B</span></label>
                    <label class="flex items-center space-x-1 cursor-pointer"><input type="radio" name="range" value="3" onchange="calculateLevels()"> <span>RANGE C</span></label>
                    <label class="flex items-center space-x-1 cursor-pointer"><input type="radio" name="range" value="4" onchange="calculateLevels()"> <span>RANGE D</span></label>
                    <label class="flex items-center space-x-1 cursor-pointer"><input type="radio" name="range" value="5" checked onchange="calculateLevels()"> <span>RANGE E</span></label>
                </div>
            </div>

            <!-- Table Results -->
            <div class="bg-gray-800 p-6 rounded-b-lg border border-gray-700 shadow-xl mb-6">
                <div class="flex justify-between items-center mb-6 font-bold text-xl border-b border-gray-700 pb-3">
                    <span class="text-emerald-400">TOTAL UP: <span id="total-up">0.00</span></span>
                    <span class="text-rose-500">TOTAL DOWN: <span id="total-down">0.00</span></span>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead class="bg-gray-700 text-gray-200 uppercase text-[18px]">
                            <tr>
                                <th class="p-4">SNAME</th>
                                <th class="p-4">LOT</th>
                                <th class="p-4">CMP</th>
                                <th class="p-4">LEVEL</th>
                                <th class="p-4 text-emerald-400">UP LEVEL</th>
                                <th class="p-4 text-rose-500">DOWN LEVEL</th>
                                <th class="p-4 text-center">ACTION</th>
                            </tr>
                        </thead>
                        <tbody id="levels-table" class="divide-y divide-gray-700"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Running Marquee -->
    <div class="fixed bottom-0 left-0 w-full bg-amber-500 text-black py-2 overflow-hidden whitespace-nowrap z-40 border-t border-amber-600 font-black">
        <div class="inline-block animate-marquee uppercase tracking-widest text-sm">
            ⚠️ THIS IS FOR EDUCATIONAL PURPOSE ONLY — HAPPY TRADING &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ⚠️ THIS IS FOR EDUCATIONAL PURPOSE ONLY — HAPPY TRADING
        </div>
    </div>

    <style>
        @keyframes marquee { 0% { transform: translateX(0%); } 100% { transform: translateX(-50%); } }
        .animate-marquee { display: inline-block; white-space: nowrap; animation: marquee 18s linear infinite; }
    </style>

    <script type="text/javascript">
        let currentScrip = "GOLD";

        // Complete MCX Commodity List (Fixed missing lot sizes & syntax errors)
        const commodityScrips = {
            "GOLD": { cmp: 72500.00, lot: 100, stepPct: 0.000237 },
            "GOLD MINI": { cmp: 72500.00, lot: 10, stepPct: 0.00025 },
            "GOLD GUINEA": { cmp: 58000.00, lot: 8, stepPct: 0.00025 },
            "GOLD TEN": { cmp: 72500.00, lot: 10, stepPct: 0.00025 },
            "GOLD PETAL": { cmp: 7250.00, lot: 1, stepPct: 0.0003 },
            "SILVER": { cmp: 85000.00, lot: 30, stepPct: 0.0004 },
            "SILVER MINI": { cmp: 85000.00, lot: 5, stepPct: 0.0004 },
            "SILVER MICRO": { cmp: 85000.00, lot: 1, stepPct: 0.0004 },
            "CRUDE OIL": { cmp: 6200.00, lot: 100, stepPct: 0.001 },
            "CRUDE MINI": { cmp: 6200.00, lot: 10, stepPct: 0.001 },
            "NATURAL GAS": { cmp: 185.00, lot: 1250, stepPct: 0.003 },
            "NATURAL GAS MIN": { cmp: 185.00, lot: 250, stepPct: 0.003 },
            "COPPER": { cmp: 810.00, lot: 2500, stepPct: 0.0015 },
            "ZINC": { cmp: 260.00, lot: 5000, stepPct: 0.002 },
            "ZINC MINI": { cmp: 260.00, lot: 1000, stepPct: 0.002 },
            "ALUMINUM": { cmp: 235.00, lot: 5000, stepPct: 0.002 },
            "ALUMINUM MINI": { cmp: 235.00, lot: 1000, stepPct: 0.002 },
            "LEAD": { cmp: 180.00, lot: 5000, stepPct: 0.002 },
            "LEAD MINI": { cmp: 180.00, lot: 1000, stepPct: 0.002 },
            "NICKEL": { cmp: 1450.00, lot: 1500, stepPct: 0.002 },
            "MCX BULLDEX": { cmp: 18000.00, lot: 50, stepPct: 0.0005 }
        };

        window.onload = function() {
            renderButtons();
            selectScrip("GOLD");
        };

        function renderButtons() {
            const container = document.getElementById("commodity-buttons");
            container.innerHTML = "";
            Object.keys(commodityScrips).forEach(name => {
                const btn = document.createElement("button");
                btn.className = `scrip-btn px-3 py-1.5 bg-gray-700 hover:bg-amber-500 hover:text-black rounded text-xs font-semibold transition text-gray-200`;
                btn.innerText = name;
                btn.onclick = () => selectScrip(name);
                container.appendChild(btn);
            });
        }

        function selectScrip(name) {
            currentScrip = name;
            document.getElementById("header-title").innerText = name;
            const item = commodityScrips[name];
            document.getElementById("lot-input").value = item.lot;
            document.getElementById("cmp-input").value = item.cmp;

            document.querySelectorAll(".scrip-btn").forEach(btn => {
                if (btn.innerText.trim() === name) {
                    btn.classList.add("bg-amber-500", "text-black", "font-bold");
                    btn.classList.remove("bg-gray-700", "text-gray-200");
                } else {
                    btn.classList.remove("bg-amber-500", "text-black", "font-bold");
                    btn.classList.add("bg-gray-700", "text-gray-200");
                }
            });
            calculateLevels();
        }

        function calculateLevels() {
            const cmp = parseFloat(document.getElementById("cmp-input").value) || 0;
            const lot = parseFloat(document.getElementById("lot-input").value) || 0;
            const stepPct = commodityScrips[currentScrip]?.stepPct || 0.000237;
            const stepValue = cmp * stepPct;
            const selectedRange = parseInt(document.querySelector('input[name="range"]:checked').value) || 5;

            document.getElementById("total-up").innerText = (cmp + (stepValue * selectedRange)).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 3 });
            document.getElementById("total-down").innerText = (cmp - (stepValue * selectedRange)).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 3 });

            const tbody = document.getElementById("levels-table");
            tbody.innerHTML = "";

            for (let i = 1; i <= selectedRange; i++) {
                const upLevel = cmp + (stepValue * i);
                const downLevel = cmp - (stepValue * i);
                const levelName = `L${i} (Range ${String.fromCharCode(64 + i)})`;

                const row = `
                    <tr class="hover:bg-gray-800 text-[18px]">
                        <td class="p-4 font-bold text-amber-400">${currentScrip}</td>
                        <td class="p-4">${lot.toLocaleString('en-IN')}</td>
                        <td class="p-4">${cmp.toLocaleString('en-IN', { minimumFractionDigits: 2 })}</td>
                        <td class="p-4 text-gray-300">${levelName}</td>
                        <td class="p-4 font-bold text-emerald-400">${upLevel.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 3 })}</td>
                        <td class="p-4 font-bold text-rose-500">${downLevel.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 3 })}</td>
                        <td class="p-4 text-center">
                            <button onclick="shareWhatsApp('${currentScrip}', ${cmp}, '${levelName}', ${upLevel.toFixed(2)}, ${downLevel.toFixed(2)})" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded text-sm font-bold flex items-center justify-center gap-1 mx-auto">
                                💬 WhatsApp
                            </button>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            }
        }

        function shareWhatsApp(scrip, cmp, level, up, down) {
            const text = `📊 *MCX COMMODITY ALERT: ${scrip}*\n\n📍 *CMP:* ${cmp}\n🎯 *Target Level:* ${level}\n\n📈 *UP LEVEL:* ${up}\n📉 *DOWN LEVEL:* ${down}\n\n_Shared via TradeCalc Hub_`;
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
        }
    </script>
</body>
</html>
