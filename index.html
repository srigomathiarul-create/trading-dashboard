<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forex Trading Hub</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; }
    
    /* Navigation Bar / Tabs */
    .tab-navigation { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; justify-content: center; }
    .tab-btn {
      background: #1e293b; color: #94a3b8; border: none; padding: 10px 18px; 
      border-radius: 20px; cursor: pointer; font-weight: bold; transition: all 0.2s;
    }
    .tab-btn:hover { background: #334155; color: #fff; }
    .tab-btn.active { background: #007aff; color: #ffffff; }

    /* Tab Content Boxes */
    .tab-content { display: none; height: 600px; width: 100%; }
    .tab-content.active { display: block; }
    iframe { border: 0; border-radius: 8px; width: 100%; height: 100%; }
  </style>
</head>
<body>

  <!-- Navigation Tabs -->
  <div class="tab-navigation">
    <button class="tab-btn active" onclick="switchTab(event, 'chart')">Chart</button>
    <button class="tab-btn" onclick="switchTab(event, 'tickers')">Tickers</button>
    <button class="tab-btn" onclick="switchTab(event, 'signals')">Signals</button>
    <button class="tab-btn" onclick="switchTab(event, 'overview')">Market Overview</button>
    <button class="tab-btn" onclick="switchTab(event, 'calendar')">Calendar</button>
    <button class="tab-btn" onclick="switchTab(event, 'news')">News Feed</button>
    <button class="tab-btn" onclick="switchTab(event, 'calculator')">Calculator</button>
  </div>

  <!-- Tab 1: Interactive Chart -->
  <div id="chart" class="tab-content active">
    <iframe src="https://s.tradingview.com/widgetembed/?symbol=FX%3AEURUSD&interval=D&theme=dark"></iframe>
  </div>

  <!-- Tab 2: Live Tickers -->
  <div id="tickers" class="tab-content">
    <iframe src="https://s.tradingview.com/embed-widget/tickers/?theme=dark&symbols=FX%3AEURUSD%2CFX%3AGBPUSD%2CFX%3AUSDJPY%2COANDA%3AXAUUSD"></iframe>
  </div>

  <!-- Tab 3: Technical Signals -->
  <div id="signals" class="tab-content">
    <iframe src="https://s.tradingview.com/embed-widget/technical-analysis/?theme=dark&symbol=FX%3AEURUSD"></iframe>
  </div>

  <!-- Tab 4: Market Overview -->
  <div id="overview" class="tab-content">
    <iframe src="https://s.tradingview.com/embed-widget/market-overview/?theme=dark"></iframe>
  </div>

  <!-- Tab 5: Economic Calendar -->
  <div id="calendar" class="tab-content">
    <iframe src="https://s.tradingview.com/embed-widget/events/?theme=dark"></iframe>
  </div>

  <!-- Tab 6: News Feed -->
  <div id="news" class="tab-content">
    <iframe src="https://s.tradingview.com/embed-widget/timeline/?theme=dark"></iframe>
  </div>

  <!-- Tab 7: Calculator Placeholder -->
  <div id="calculator" class="tab-content">
    <div style="background:#1e293b; padding:40px; text-align:center; border-radius:8px;">
      <h2>Forex Position Size & Pip Calculator</h2>
      <p>Custom position calculator tool content goes here.</p>
    </div>
  </div>

  <!-- JavaScript to handle Tab switching -->
  <script>
    function switchTab(event, tabId) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      event.currentTarget.classList.add('active');
    }
  </script>

</body>
</html>
