<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NSE Market Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; }
    
    /* Top Ticker Bar */
    .ticker-container { margin-bottom: 20px; border-radius: 8px; overflow: hidden; }

    /* Navigation Tabs */
    .tab-navigation { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; justify-content: center; }
    .tab-btn {
      background: #1e293b; color: #94a3b8; border: none; padding: 10px 18px; 
      border-radius: 20px; cursor: pointer; font-weight: bold; transition: all 0.2s;
    }
    .tab-btn:hover { background: #334155; color: #fff; }
    .tab-btn.active { background: #007aff; color: #ffffff; }

    /* Tab Content Boxes */
    .tab-content { display: none; height: 600px; width: 100%; }
    .tab-content.active { display: block; }
    iframe { border: 0; border-radius: 8px; width: 100%; height: 100%; }
  </style>
</head>
<body>

  <!-- Top Moving Ticker Tape with Indian Market (NSE) Tickers -->
  <div class="ticker-container">
    <div class="tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
      {
        "symbols": [
          { "proName": "NSE:NIFTY", "title": "NIFTY 50" },
          { "proName": "NSE:BANKNIFTY", "title": "BANK NIFTY" },
          { "proName": "NSE:FINNIFTY", "title": "FIN NIFTY" },
          { "proName": "NSE:RELIANCE", "title": "RELIANCE" },
          { "proName": "NSE:HDFCBANK", "title": "HDFC BANK" },
          { "proName": "NSE:ICICIBANK", "title": "ICICI BANK" },
          { "proName": "NSE:INFY", "title": "INFOSYS" },
          { "proName": "NSE:TCS", "title": "TCS" }
        ],
        "showSymbolLogo": true,
        "colorTheme": "dark",
        "isTransparent": false,
        "displayMode": "adaptive",
        "locale": "in"
      }
      </script>
    </div>
  </div>

  <!-- Dashboard Navigation Tabs -->
  <div class="tab-navigation">
    <button class="tab-btn active" onclick="switchTab(event, 'chart')">NSE Chart</button>
    <button class="tab-btn" onclick="switchTab(event, 'signals')">Technical Analysis</button>
    <button class="tab-btn" onclick="switchTab(event, 'overview')">NSE Overview</button>
    <button class="tab-btn" onclick="switchTab(event, 'calendar')">Economic Calendar</button>
    <button class="tab-btn" onclick="switchTab(event, 'news')">Market News</button>
  </div>

  <!-- Tab 1: Live Interactive NSE Chart -->
  <div id="chart" class="tab-content active">
    <iframe src="https://s.tradingview.com/widgetembed/?symbol=NSE%3ANIFTY&interval=D&theme=dark"></iframe>
  </div>

  <!-- Tab 2: Technical Signals & Analysis -->
  <div id="signals" class="tab-content">
    <iframe src="https://s.tradingview.com/embed-widget/technical-analysis/?theme=dark&symbol=NSE%3ANIFTY"></iframe>
  </div>

  <!-- Tab 3: NSE Market Overview -->
  <div id="overview" class="tab-content">
    <iframe src="https://s.tradingview.com/embed-widget/market-overview/?theme=dark"></iframe>
  </div>

  <!-- Tab 4: Economic Calendar -->
  <div id="calendar" class="tab-content">
    <iframe src="https://s.tradingview.com/embed-widget/events/?theme=dark"></iframe>
  </div>

  <!-- Tab 5: Market News Feed -->
  <div id="news" class="tab-content">
    <iframe src="https://s.tradingview.com/embed-widget/timeline/?theme=dark"></iframe>
  </div>

  <!-- JavaScript to Handle Tab Switching -->
  <script>
    function switchTab(event, tabId) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      event.currentTarget.classList.add('active');
    }
  </script>

</body>
</html>
