<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Markets - TradeCalc Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="nav.js" defer></script>
</head>
<body class="bg-gray-900 text-white min-h-screen">

    <!-- Top Market Ticker Tape -->
    <div class="tradingview-widget-container border-b border-gray-800">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
        {
            "symbols": [
                {"proName": "NSE:NIFTY", "title": "NIFTY 50"},
                {"proName": "NSE:BANKNIFTY", "title": "BANK NIFTY"},
                {"proName": "BSE:SENSEX", "title": "SENSEX"},
                {"proName": "FX_IDC:USDINR", "title": "USD/INR"}
            ],
            "colorTheme": "dark",
            "isTransparent": false,
            "displayMode": "adaptive",
            "locale": "en"
        }
        </script>
    </div>

    <!-- Main Live Chart Section -->
    <main class="p-6">
        <h1 class="text-2xl font-bold mb-4 text-blue-400">Live Technical Analysis</h1>
        <div class="bg-gray-800 p-4 rounded-lg shadow-lg h-[600px]">
            <div class="tradingview-widget-container" style="height:100%;width:100%">
                <div id="tradingview_chart" style="height:100%;width:100%"></div>
                <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
                <script type="text/javascript">
                    new TradingView.widget({
                        "autosize": true,
                        "symbol": "NSE:NIFTY",
                        "interval": "D",
                        "timezone": "Asia/Kolkata",
                        "theme": "dark",
                        "style": "1",
                        "locale": "en",
                        "toolbar_bg": "#f1f3f6",
                        "enable_publishing": false,
                        "allow_symbol_change": true,
                        "container_id": "tradingview_chart"
                    });
                </script>
            </div>
        </div>
    </main>

</body>
</html>
