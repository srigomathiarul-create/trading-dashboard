<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forex Technical Analysis - TradeCalc Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="nav.js" defer></script>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <div id="navbar"></div>

    <main class="p-6 max-w-7xl mx-auto">
        <h1 class="text-2xl font-bold mb-4 text-purple-400">Forex Technical Analysis</h1>
        
        <!-- Horizontal Selector Buttons -->
        <div class="flex flex-wrap gap-2 mb-6 bg-gray-800 p-4 rounded-lg border border-gray-700">
            <button onclick="loadChart('OANDA:XAUUSD')" class="scrip-btn px-3 py-1.5 bg-purple-600 text-white rounded text-sm font-semibold transition">XAUSD GOLD</button>
            <button onclick="loadChart('BINANCE:BTCUSDT')" class="scrip-btn px-3 py-1.5 bg-gray-700 hover:bg-purple-600 rounded text-sm font-semibold transition">BTCUSD</button>
            <button onclick="loadChart('OANDA:XAGUSD')" class="scrip-btn px-3 py-1.5 bg-gray-700 hover:bg-purple-600 rounded text-sm font-semibold transition">XNGUSD SILVER</button>
            <button onclick="loadChart('TVC:USOIL')" class="scrip-btn px-3 py-1.5 bg-gray-700 hover:bg-purple-600 rounded text-sm font-semibold transition">XTI CRUDE</button>
            <button onclick="loadChart('CAPITALCOM:NATURALGAS')" class="scrip-btn px-3 py-1.5 bg-gray-700 hover:bg-purple-600 rounded text-sm font-semibold transition">XNGUSD N.GAS</button>
            <button onclick="loadChart('FX:USDJPY')" class="scrip-btn px-3 py-1.5 bg-gray-700 hover:bg-purple-600 rounded text-sm font-semibold transition">USD JPY</button>
            <button onclick="loadChart('FX:AUDJPY')" class="scrip-btn px-3 py-1.5 bg-gray-700 hover:bg-purple-600 rounded text-sm font-semibold transition">AUD JPY</button>
            <button onclick="loadChart('FX:GBPJPY')" class="scrip-btn px-3 py-1.5 bg-gray-700 hover:bg-purple-600 rounded text-sm font-semibold transition">GBP JPY</button>
            <button onclick="loadChart('FX:EURJPY')" class="scrip-btn px-3 py-1.5 bg-gray-700 hover:bg-purple-600 rounded text-sm font-semibold transition">EUR JPY</button>
            <button onclick="loadChart('FX:NZDJPY')" class="scrip-btn px-3 py-1.5 bg-gray-700 hover:bg-purple-600 rounded text-sm font-semibold transition">NZD JPY</button>
            <button onclick="loadChart('FX:CADJPY')" class="scrip-btn px-3 py-1.5 bg-gray-700 hover:bg-purple-600 rounded text-sm font-semibold transition">CAD JPY</button>
            <button onclick="loadChart('FX:CHFJPY')" class="scrip-btn px-3 py-1.5 bg-gray-700 hover:bg-purple-600 rounded text-sm font-semibold transition">CHF JPY</button>
            <button onclick="loadChart('BINANCE:ETHUSDT')" class="scrip-btn px-3 py-1.5 bg-gray-700 hover:bg-purple-600 rounded text-sm font-semibold transition">ETH USD</button>
        </div>

        <!-- TradingView Container -->
        <div class="bg-gray-800 p-4 rounded-lg border border-gray-700 h-[620px]">
            <div id="tradingview_chart" class="w-full h-full"></div>
        </div>
    </main>

    <!-- TradingView Embed Widget JS -->
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script type="text/javascript">
        function loadChart(symbolName) {
            document.getElementById("tradingview_chart").innerHTML = "";
            new TradingView.widget({
                "autosize": true,
                "symbol": symbolName,
                "interval": "D",
                "timezone": "Etc/UTC",
                "theme": "dark",
                "style": "1",
                "locale": "en",
                "enable_publishing": false,
                "allow_symbol_change": true,
                "container_id": "tradingview_chart"
            });

            // Highlight active button
            const buttons = document.querySelectorAll('.scrip-btn');
            buttons.forEach(btn => {
                if (btn.getAttribute('onclick').includes(symbolName)) {
                    btn.classList.add('bg-purple-600', 'text-white');
                    btn.classList.remove('bg-gray-700');
                } else {
                    btn.classList.remove('bg-purple-600', 'text-white');
                    btn.classList.add('bg-gray-700');
                }
            });
        }

        window.addEventListener('load', function() {
            loadChart('OANDA:XAUUSD');
        });
    </script>
</body>
</html>
