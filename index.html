<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOREX LIVE</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000000; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .header { text-align: center; padding: 12px; background: #ffd700; color: #000000; font-weight: bold; font-size: 1.1rem; letter-spacing: 1px; text-transform: uppercase; box-shadow: 0 2px 5px rgba(0,0,0,0.5); position: relative; z-index: 10; }
        .chart-container { width: 100%; height: calc(100% - 47px); background: #131722; position: relative; }
        #tradingview_advanced { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <!-- Header name strictly changed to FOREX -->
    <div class="header">FOREX</div>

    <!-- 100% Full-Screen Advanced Chart Container -->
    <div class="chart-container">
        <div id="tradingview_advanced"></div>
    </div>

    <!-- Safe Cross-Origin Script Standard Library -->
    <script type="text/javascript" src="https://tradingview.com"></script>
    <script type="text/javascript">
        new TradingView.widget({
            "autosize": true,
            "symbol": "OANDA:XAUUSD",
            "interval": "5",
            "timezone": "Asia/Kolkata",
            "theme": "dark",
            "style": "1",
            "locale": "en",
            "enable_publishing": false,
            "hide_side_toolbar": false,
            "allow_symbol_change": true,
            "container_id": "tradingview_advanced"
        });
    </script>

</body>
</html>
