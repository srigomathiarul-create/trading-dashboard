<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commodity Markets - TradeCalc Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="nav.js" defer></script>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <div id="navbar"></div>

    <main class="p-6 max-w-7xl mx-auto">
        <h1 class="text-2xl font-bold mb-4 text-amber-400">Commodity Technical Analysis</h1>
        
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-4">
            <div class="bg-gray-800 p-4 rounded-lg border border-gray-700">
                <h2 class="text-lg font-semibold mb-3 text-gray-300">Select Commodity</h2>
                <div class="space-y-2">
                    <button onclick="loadChart('MCX:GOLD1!')" class="w-full text-left px-3 py-2 bg-gray-700 hover:bg-amber-600 rounded">MCX Gold</button>
                    <button onclick="loadChart('MCX:SILVER1!')" class="w-full text-left px-3 py-2 bg-gray-700 hover:bg-amber-600 rounded">MCX Silver</button>
                    <button onclick="loadChart('MCX:CRUDEOIL1!')" class="w-full text-left px-3 py-2 bg-gray-700 hover:bg-amber-600 rounded">MCX Crude Oil</button>
                    <button onclick="loadChart('TVC:GOLD')" class="w-full text-left px-3 py-2 bg-gray-700 hover:bg-amber-600 rounded">Spot Gold (USD)</button>
                </div>
            </div>

            <div class="lg:col-span-3 bg-gray-800 p-4 rounded-lg border border-gray-700 h-[600px]">
                <div id="tradingview_chart" style="height:100%;width:100%"></div>
            </div>
        </div>
    </main>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script type="text/javascript">
        function loadChart(symbolName) {
            document.getElementById("tradingview_chart").innerHTML = "";
            new TradingView.widget({
                "autosize": true,
                "symbol": symbolName,
                "interval": "D",
                "timezone": "Asia/Kolkata",
                "theme": "dark",
                "style": "1",
                "locale": "en",
                "enable_publishing": false,
                "allow_symbol_change": true,
                "container_id": "tradingview_chart"
            });
        }
        loadChart('MCX:GOLD1!');
    </script>
</body>
</html>
