<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position Size Calculator - TradeCalc Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="nav.js" defer></script>
</head>
<body class="bg-gray-900 text-white min-h-screen">

    <main class="max-w-2xl mx-auto mt-10 p-6 bg-gray-800 rounded-lg border border-gray-700">
        <h1 class="text-2xl font-bold mb-6 text-green-400">Position Size & Risk Calculator</h1>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm mb-1">Total Capital (₹):</label>
                <input id="capital" type="number" value="100000" class="w-full p-2 bg-gray-700 rounded border border-gray-600 focus:outline-none focus:border-green-400">
            </div>
            <div>
                <label class="block text-sm mb-1">Risk per Trade (%):</label>
                <input id="risk" type="number" value="1" class="w-full p-2 bg-gray-700 rounded border border-gray-600 focus:outline-none focus:border-green-400">
            </div>
            <div>
                <label class="block text-sm mb-1">Entry Price (₹):</label>
                <input id="entry" type="number" value="500" class="w-full p-2 bg-gray-700 rounded border border-gray-600 focus:outline-none focus:border-green-400">
            </div>
            <div>
                <label class="block text-sm mb-1">Stop Loss Price (₹):</label>
                <input id="stoploss" type="number" value="490" class="w-full p-2 bg-gray-700 rounded border border-gray-600 focus:outline-none focus:border-green-400">
            </div>

            <button onclick="calculate()" class="w-full bg-green-500 text-black font-bold py-2 rounded hover:bg-green-400 transition">Calculate Quantity</button>
        </div>

        <div class="mt-6 p-4 bg-gray-700 rounded border border-gray-600 grid grid-cols-2 gap-4">
            <div>
                <p class="text-xs text-gray-400">Max Risk Amount</p>
                <p id="riskAmt" class="text-xl font-bold text-red-400">₹0</p>
            </div>
            <div>
                <p class="text-xs text-gray-400">Max Quantity</p>
                <p id="qty" class="text-xl font-bold text-green-400">0</p>
            </div>
        </div>
    </main>

    <script>
        function calculate() {
            const capital = parseFloat(document.getElementById('capital').value) || 0;
            const risk = parseFloat(document.getElementById('risk').value) || 0;
            const entry = parseFloat(document.getElementById('entry').value) || 0;
            const sl = parseFloat(document.getElementById('stoploss').value) || 0;

            const maxRisk = capital * (risk / 100);
            const riskPerShare = Math.abs(entry - sl);

            if (riskPerShare > 0) {
                const quantity = Math.floor(maxRisk / riskPerShare);
                document.getElementById('riskAmt').innerText = '₹' + maxRisk.toFixed(2);
                document.getElementById('qty').innerText = quantity + ' shares';
            }
        }
        calculate();
    </script>
</body>
</html>
