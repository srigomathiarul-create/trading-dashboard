<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commodity Dashboard - TradeCalc Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="nav.js" defer></script>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <div id="navbar"></div>

    <main class="p-6 max-w-6xl mx-auto">
        <!-- Horizontal Commodity Button Tabs -->
        <div class="flex flex-wrap gap-2 mb-6 bg-gray-800 p-4 rounded-lg border border-gray-700">
            <button onclick="selectScrip('GOLD')" class="scrip-btn px-3 py-1.5 bg-gray-700 hover:bg-amber-600 rounded text-sm font-semibold transition">GOLD</button>
            <button onclick="selectScrip('GOLD MINI')" class="scrip-btn px-3 py-1.5 bg-gray-700 hover:bg-amber-600 rounded text-sm font-semibold transition">GOLD MINI</button>
            <button onclick="selectScrip('GOLD GUINEA')" class="scrip-btn px-3 py-1.5 bg-gray-700 hover:bg-amber-600 rounded text-sm font-semibold transition">GOLD GUINEA</button>
            <button onclick="selectScrip('GOLD TEN')" class="scrip-btn px-3 py-1.5 bg-gray-700 hover:bg-amber-600 rounded text-sm font-semibold transition">GOLD TEN</button>
            <button onclick="selectScrip('GOLD PETAL')" class="scrip-btn px-3 py-1.5 bg-gray-700 hover:bg-amber-600 rounded text-sm font-semibold transition">GOLD PETAL</button>
            <button onclick="selectScrip('SILVER')" class="scrip-btn px-3 py-1.5 bg-gray-700 hover:bg-amber-600 rounded text-sm font-semibold transition">SILVER</button>
            <button onclick="selectScrip('SILVER MINI')" class="scrip-btn px-3 py-1.5 bg-gray-700 hover:bg-amber-600 rounded text-sm font-semibold transition">SILVER MINI</button>
            <button onclick="selectScrip('SILVER MICRO')" class="scrip-btn px-3 py-1.5 bg-gray-700 hover:bg-amber-600 rounded text-sm font-semibold transition">SILVER MICRO</button>
            <button onclick="selectScrip('CRUDE')" class="scrip-btn px-3 py-1.5 bg-gray-700 hover:bg-amber-600 rounded text-sm font-semibold transition">CRUDE</button>
            <button onclick="selectScrip('CRUDE MINI')" class="scrip-btn px-3 py-1.5 bg-gray-700 hover:bg-amber-600 rounded text-sm font-semibold transition">CRUDE MINI</button>
            <button onclick="selectScrip('NATURAL GAS')" class="scrip-btn px-3 py-1.5 bg-gray-700 hover:bg-amber-600 rounded text-sm font-semibold transition">NATURAL GAS</button>
            <button onclick="selectScrip('NATURAL GAS MINI')" class="scrip-btn px-3 py-1.5 bg-gray-700 hover:bg-amber-600 rounded text-sm font-semibold transition">NATURAL GAS MINI</button>
            <button onclick="selectScrip('ALUMINUM')" class="scrip-btn px-3 py-1.5 bg-gray-700 hover:bg-amber-600 rounded text-sm font-semibold transition">ALUMINUM</button>
            <button onclick="selectScrip('LEAD')" class="scrip-btn px-3 py-1.5 bg-gray-700 hover:bg-amber-600 rounded text-sm font-semibold transition">LEAD</button>
            <button onclick="selectScrip('ZINC')" class="scrip-btn px-3 py-1.5 bg-gray-700 hover:bg-amber-600 rounded text-sm font-semibold transition">ZINC</button>
            <button onclick="selectScrip('COPPER')" class="scrip-btn px-3 py-1.5 bg-gray-700 hover:bg-amber-600 rounded text-sm font-semibold transition">COPPER</button>
        </div>

        <!-- Calculator Output Container -->
        <div class="bg-amber-500 text-gray-900 p-6 rounded-t-lg shadow-md border-b-2 border-amber-600">
            <h1 id="header-title" class="text-3xl font-black text-center tracking-wider uppercase mb-4 text-gray-900">GOLD MINI</h1>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 max-w-xl mx-auto">
                <div>
                    <label class="block text-xs font-bold uppercase mb-1 text-gray-900">Live CMP</label>
                    <input type="number" id="cmp-input" value="152815" oninput="calculateLevels()" class="w-full bg-black text-white p-2.5 rounded font-bold border border-amber-700 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase mb-1 text-gray-900">Net Value</label>
                    <input type="number" id="net-input" value="182" oninput="calculateLevels()" class="w-full bg-black text-white p-2.5 rounded font-bold border border-amber-700 focus:outline-none">
                </div>
            </div>

            <!-- Range Selectors -->
            <div class="flex flex-wrap justify-center gap-4 mt-4 text-xs font-bold text-gray-900">
                <label class="flex items-center space-x-1"><input type="radio" name="range" value="1" onchange="calculateLevels()"> <span>RANGE A</span></label>
                <label class="flex items-center space-x-1"><input type="radio" name="range" value="2" onchange="calculateLevels()"> <span>RANGE B</span></label>
                <label class="flex items-center space-x-1"><input type="radio" name="range" value="3" onchange="calculateLevels()"> <span>RANGE C</span></label>
                <label class="flex items-center space-x-1"><input type="radio" name="range" value="4" onchange="calculateLevels()"> <span>RANGE D</span></label>
                <label class="flex items-center space-x-1"><input type="radio" name="range" value="5" checked onchange="calculateLevels()"> <span>RANGE E</span></label>
            </div>
        </div>

        <!-- Target / Level Output Card -->
        <div class="bg-gray-800 p-6 rounded-b-lg border border-gray-700 shadow-xl">
            <div class="flex justify-between items-center mb-6 font-bold text-lg border-b border-gray-700 pb-3">
                <span class="text-emerald-400">TOTAL UP (CMP + NET): <span id="total-up">152997.00</span></span>
                <span class="text-rose-500">TOTAL DOWN (CMP - NET): <span id="total-down">152633.00</span></span>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-gray-700 text-gray-300 uppercase text-xs">
                        <tr>
                            <th class="p-3">SNAME</th>
                            <th class="p-3">LOT</th>
                            <th class="p-3">CMP</th>
                            <th class="p-3">LEVEL</th>
                            <th class="p-3 text-emerald-400">BUY LEVEL</th>
                            <th class="p-3 text-rose-500">SELL LEVEL</th>
                        </tr>
                    </thead>
                    <tbody id="levels-table" class="divide-y divide-gray-700">
                        <!-- Generated Dynamically -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const commodityConfig = {
            "GOLD": { lot: 100, cmp: 72000, net: 500 },
            "GOLD MINI": { lot: 10, cmp: 152815, net: 182 },
            "GOLD GUINEA": { lot: 1, cmp: 58000, net: 150 },
            "GOLD TEN": { lot: 10, cmp: 72000, net: 200 },
            "GOLD PETAL": { lot: 1, cmp: 7200, net: 30 },
            "SILVER": { lot: 30, cmp: 85000, net: 1000 },
            "SILVER MINI": { lot: 5, cmp: 85000, net: 1000 },
            "SILVER MICRO": { lot: 1, cmp: 85000, net: 1000 },
            "CRUDE": { lot: 100, cmp: 6200, net: 80 },
            "CRUDE MINI": { lot: 10, cmp: 6200, net: 80 },
            "NATURAL GAS": { lot: 1250, cmp: 190, net: 5 },
            "NATURAL GAS MINI": { lot: 250, cmp: 190, net: 5 },
            "ALUMINUM": { lot: 5000, cmp: 230, net: 3 },
            "LEAD": { lot: 5000, cmp: 180, net: 2 },
            "ZINC": { lot: 5000, cmp: 260, net: 4 },
            "COPPER": { lot: 2500, cmp: 800, net: 10 }
        };

        let currentScrip = "GOLD MINI";

        function selectScrip(scripName) {
            currentScrip = scripName;
            document.getElementById('header-title').innerText = scripName;
            
            const config = commodityConfig[scripName] || { lot: 10, cmp: 1000, net: 10 };
            document.getElementById('cmp-input').value = config.cmp;
            document.getElementById('net-input').value = config.net;
            
            // Highlight active button tab
            const buttons = document.querySelectorAll('.scrip-btn');
            buttons.forEach(btn => {
                if (btn.innerText.trim() === scripName) {
                    btn.classList.add('bg-amber-600', 'text-white');
                    btn.classList.remove('bg-gray-700');
                } else {
                    btn.classList.remove('bg-amber-600');
                    btn.classList.add('bg-gray-700');
                }
            });

            calculateLevels();
        }

        function calculateLevels() {
            const cmp = parseFloat(document.getElementById('cmp-input').value) || 0;
            const net = parseFloat(document.getElementById('net-input').value) || 0;
            const config = commodityConfig[currentScrip] || { lot: 1 };
            const netStep = net / 5;

            document.getElementById('total-up').innerText = (cmp + net).toFixed(2);
            document.getElementById('total-down').innerText = (cmp - net).toFixed(2);

            const tbody = document.getElementById('levels-table');
            tbody.innerHTML = '';

            for (let i = 1; i <= 5; i++) {
                const buyLevel = cmp + (netStep * i);
                const sellLevel = cmp - (netStep * i);

                const row = `
                    <tr class="hover:bg-gray-800">
                        <td class="p-3 font-bold text-amber-400">${currentScrip}</td>
                        <td class="p-3">${config.lot}</td>
                        <td class="p-3">${cmp.toFixed(2)}</td>
                        <td class="p-3 text-gray-400">L${i} (Range ${String.fromCharCode(64 + i)})</td>
                        <td class="p-3 font-bold text-emerald-400">${buyLevel.toFixed(2)}</td>
                        <td class="p-3 font-bold text-rose-500">${sellLevel.toFixed(2)}</td>
                    </tr>
                `;
                tbody.innerHTML += row;
            }
        }

        window.addEventListener('DOMContentLoaded', () => selectScrip('GOLD MINI'));
    </script>
</body>
</html>
