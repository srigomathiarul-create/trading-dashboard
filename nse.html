<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NSE Market Range Calculator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen">

  <div id="navbar"></div>

  <div class="max-w-5xl mx-auto p-6 mt-6">
    <div class="bg-slate-800 rounded-xl p-6 shadow-xl border border-slate-700">
      <h1 class="text-2xl font-bold text-blue-400 text-center uppercase mb-6">NSE Market Range Calculator</h1>

      <div id="nse-buttons" class="flex flex-wrap gap-2 justify-center bg-slate-900 p-4 rounded-lg mb-6 border border-slate-700 max-h-48 overflow-y-auto"></div>

      <div class="bg-amber-500 text-black p-6 rounded-t-xl text-center">
        <h2 id="selected-name" class="text-3xl font-black mb-3">NIFTY 50</h2>
        <div class="flex justify-center gap-6">
          <div class="bg-slate-100 px-6 py-2 rounded text-black font-bold">LOT SIZE: <span id="lot-size">50</span></div>
          <div class="bg-black text-white px-6 py-2 rounded font-bold">LIVE CMP: <span id="cmp-val">24,500.00</span></div>
        </div>
      </div>

      <div class="overflow-x-auto bg-slate-800 rounded-b-xl p-4 border-t border-slate-700">
        <table class="w-full text-left">
          <thead>
            <tr class="bg-slate-900 text-slate-400 text-sm">
              <th class="p-3">SNAME</th>
              <th class="p-3">LOT</th>
              <th class="p-3">CMP</th>
              <th class="p-3">LEVEL</th>
              <th class="p-3">UP LEVEL</th>
              <th class="p-3">DOWN LEVEL</th>
              <th class="p-3">ACTION</th>
            </tr>
          </thead>
          <tbody id="levels-table-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="nav.js"></script>
  <script>
    const nseData = [
      { name: "NIFTY 50", cmp: 24500.00, net: 122.50, lot: 50 },
      { name: "BANK NIFTY", cmp: 52200.00, net: 261.00, lot: 15 },
      { name: "FIN NIFTY", cmp: 23100.00, net: 115.50, lot: 25 },
      { name: "MIDCP NIFTY", cmp: 13000.00, net: 65.00, lot: 50 },
      { name: "RELIANCE", cmp: 2950.00, net: 22.10, lot: 250 },
      { name: "TCS", cmp: 4200.00, net: 31.50, lot: 175 },
      { name: "HDFC BANK", cmp: 1650.00, net: 12.30, lot: 550 },
      { name: "INFOSYS", cmp: 1820.00, net: 13.60, lot: 400 },
      { name: "ICICI BANK", cmp: 1210.00, net: 9.00, lot: 700 },
      { name: "BHARTI AIRTEL", cmp: 1450.00, net: 10.80, lot: 475 },
      { name: "SBIN", cmp: 810.00, net: 6.00, lot: 750 },
      { name: "TATA MOTORS", cmp: 1080.00, net: 8.10, lot: 550 }
    ];

    function renderButtons() {
      const container = document.getElementById("nse-buttons");
      container.innerHTML = "";
      
      nseData.forEach((item, index) => {
        const btn = document.createElement("button");
        btn.className = `px-3 py-1.5 text-xs font-bold rounded border ${index === 0 ? 'bg-amber-500 text-black border-amber-500' : 'bg-slate-800 text-white border-slate-600 hover:border-amber-400'}`;
        btn.innerText = item.name;
        btn.onclick = () => {
          document.querySelectorAll("#nse-buttons button").forEach(b => {
            b.className = "px-3 py-1.5 text-xs font-bold rounded border bg-slate-800 text-white border-slate-600";
          });
          btn.className = "px-3 py-1.5 text-xs font-bold rounded border bg-amber-500 text-black border-amber-500";
          calculateAndDisplay(item);
        };
        container.appendChild(btn);
      });
      if (nseData.length > 0) calculateAndDisplay(nseData[0]);
    }

    function calculateAndDisplay(item) {
      document.getElementById("selected-name").innerText = item.name;
      document.getElementById("lot-size").innerText = item.lot;
      document.getElementById("cmp-val").innerText = item.cmp.toLocaleString('en-IN', {minimumFractionDigits: 2});

      const tableBody = document.getElementById("levels-table-body");
      tableBody.innerHTML = "";

      const levels = [
        { label: "L1 (Range A)", mult: 1 },
        { label: "L2 (Range B)", mult: 2 },
        { label: "L3 (Range C)", mult: 3 }
      ];

      levels.forEach(lvl => {
        const upLevel = (item.cmp + (item.net * lvl.mult)).toFixed(2);
        const downLevel = (item.cmp - (item.net * lvl.mult)).toFixed(2);
        const waText = encodeURIComponent(`*NSE ${item.name}* Level: ${lvl.label}\nCMP: ${item.cmp}\nUP: ${upLevel}\nDOWN: ${downLevel}`);

        const row = `
          <tr class="border-b border-slate-700">
            <td class="p-3 font-bold text-amber-400">${item.name}</td>
            <td class="p-3">${item.lot}</td>
            <td class="p-3">${item.cmp.toLocaleString('en-IN', {minimumFractionDigits: 2})}</td>
            <td class="p-3">${lvl.label}</td>
            <td class="p-3 font-bold text-emerald-400">${Number(upLevel).toLocaleString('en-IN', {minimumFractionDigits: 2})}</td>
            <td class="p-3 font-bold text-rose-500">${Number(downLevel).toLocaleString('en-IN', {minimumFractionDigits: 2})}</td>
            <td class="p-3"><a href="https://api.whatsapp.com/send?text=${waText}" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1 rounded text-xs font-bold inline-block">💬 WhatsApp</a></td>
          </tr>
        `;
        tableBody.innerHTML += row;
      });
    }

    renderButtons();
  </script>
</body>
</html>
